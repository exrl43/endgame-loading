<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#07152f" />
  <title>Endgame Menu — Christmas</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #050816;
    }

    body {
      display: grid;
      place-items: center;
    }

    .loading-screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      object-position: center;
      user-select: none;
      -webkit-user-drag: none;
    }
  </style>
</head>
<body>
  <img
    class="loading-screen"
    src="./endgame-menu-christmas.gif"
    alt="Endgame Menu Christmas loading screen"
  />
</body>
</html>
